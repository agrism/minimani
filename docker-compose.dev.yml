version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: minimani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minimani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minimani_secret}
      POSTGRES_DB: ${POSTGRES_DB:-minimani_db}
    ports:
      - "${DB_PORT:-5438}:5432"
    volumes:
      - minimani_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minimani} -d ${POSTGRES_DB:-minimani_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: minimani_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - minimani_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minimani_postgres_data:
  minimani_redis_data:

