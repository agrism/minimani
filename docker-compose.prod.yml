version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: minimani_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv/frontend:ro
      - media_data:/var/media:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minimani_backend
    restart: unless-stopped
    environment:
      PORT: 8088
      ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-minimani}:${POSTGRES_PASSWORD:-minimani_secret}@postgres:5432/${POSTGRES_DB:-minimani_db}?sslmode=disable
      MEDIA_DIR: /var/media
    volumes:
      - media_data:/var/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minimani_frontend
    restart: "no"
    volumes:
      - frontend_dist:/dist

  postgres:
    image: postgis/postgis:16-3.4
    container_name: minimani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minimani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minimani_secret}
      POSTGRES_DB: ${POSTGRES_DB:-minimani_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minimani} -d ${POSTGRES_DB:-minimani_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: minimani_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:
  frontend_dist:

