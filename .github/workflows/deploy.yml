name: Deploy MiniMani to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Hetzner Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Go Backend (Linux AMD64)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server-linux-amd64 cmd/server/main.go

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Server via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST || '65.21.182.7' }}
          USER: ${{ secrets.SSH_USER || 'root' }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ SSH_PRIVATE_KEY secret is not configured in GitHub repository secrets!"
            echo "👉 Add SSH_PRIVATE_KEY in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          echo "📦 Copying pre-built binary and frontend assets to Hetzner server..."
          scp backend/bin/server-linux-amd64 $USER@$HOST:/var/www/minimani.kilograms.lv/backend/bin/server-linux-amd64
          scp -r frontend/dist/* $USER@$HOST:/var/www/minimani.kilograms.lv/frontend/dist/

          echo "🚀 Updating code and restarting Docker containers..."
          ssh -i ~/.ssh/id_rsa $USER@$HOST << EOF
            set -e
            cd /var/www/minimani.kilograms.lv
            git pull origin main

            # Ensure .env has S3 keys from secrets
            if [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
              if grep -q "S3_ACCESS_KEY=" .env; then
                sed -i "s|^S3_ACCESS_KEY=.*|S3_ACCESS_KEY=$S3_ACCESS_KEY|" .env
              else
                echo "S3_ACCESS_KEY=$S3_ACCESS_KEY" >> .env
              fi

              if grep -q "S3_SECRET_KEY=" .env; then
                sed -i "s|^S3_SECRET_KEY=.*|S3_SECRET_KEY=$S3_SECRET_KEY|" .env
              else
                echo "S3_SECRET_KEY=$S3_SECRET_KEY" >> .env
              fi
            fi

            # Rebuild container and restart
            docker compose up -d --build
            echo "🎉 MiniMani successfully updated at https://minimani.kilograms.lv"
          EOF
